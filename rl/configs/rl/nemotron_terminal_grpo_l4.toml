max_steps = 50
seq_len = 8192

[model]
name = "Qwen/Qwen3.8-27B"

[orchestrator]
batch_size = 4
group_size = 4
max_inflight_episodes = 4
pre_batch_filters = []
post_batch_filters = []

[orchestrator.algo]
type = "grpo"

[orchestrator.train.sampling]
temperature = 0.8
max_completion_tokens = 1024

[[orchestrator.train.source]]
name = "nemotron-terminal-train"

[orchestrator.train.source.env.taskset]
id = "rl_pivot_terminal"
num_tasks = 2000

[orchestrator.train.source.env.agent]
max_turns = 1

[orchestrator.train.source.env.agent.harness]
id = "null"

[orchestrator.train.source.env.agent.runtime]
type = "subprocess"

[inference]

[inference.vllm]
gpu_memory_utilization = 0.90
max_model_len = 8192
enforce_eager = true
dtype = "bfloat16"
trust_remote_code = true

[trainer.model]
fsdp_cpu_offload = true
optim_cpu_offload = false

[trainer.model.lora]
rank = 32
alpha = 64.0
dropout = 0.05
target_modules = [
    "q_proj",
    "k_proj",
    "v_proj",
    "o_proj",
    "gate_proj",
    "up_proj",
    "down_proj"
]

[trainer.optim]
lr = 1.0e-5

[ckpt]
interval = 5

[orchestrator.renderer]
name = "qwen3"
