model_id: "Qwen/Qwen3.8-27B"
tokenizer_id: "Qwen/Qwen3.8-27B"
seed: 42
max_seq_length: 8192
dataset_name_or_path: "dataset/data/converted/fable5_sft_qwen_native.jsonl"
train_split: "train"
eval_split: "eval"
assistant_only_loss: true
batch_size: 1
gradient_accumulation_steps: 4
learning_rate: 2.0e-5
weight_decay: 0.01
num_epochs: 3
warmup_ratio: 0.05
output_dir: "artifacts/checkpoints/sft"
dtype: "bfloat16"
grad_clip: 1.0
allow_zero_supervised_tokens: false
